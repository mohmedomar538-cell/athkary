<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكاري</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f2d2a;--mute:#6b7a75;--acc:#1f6f5c;--acc2:#e3f1ec;--line:#e4dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181a;--card:#172224;--ink:#e8efec;--mute:#93a59f;--acc:#4fc3a1;--acc2:#1d3a34;--line:#27393a}}
:root[data-theme="dark"]{--bg:#10181a;--card:#172224;--ink:#e8efec;--mute:#93a59f;--acc:#4fc3a1;--acc2:#1d3a34;--line:#27393a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:16px 14px 90px}
h1{font-size:20px;margin:6px 0 12px;text-align:center}
.seg{display:flex;background:var(--acc2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:700 15px Cairo,sans-serif;padding:10px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;user-select:none}
.card.done{opacity:.55}
.t{font:400 21px/2 Amiri,serif;margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px}
.pill{background:var(--acc2);color:var(--acc);font-weight:700;border-radius:20px;padding:4px 12px;font-size:14px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.tas{text-align:center;padding-top:18px}
.circle{width:240px;height:240px;border-radius:50%;margin:18px auto;border:0;background:var(--acc);color:#fff;font:700 72px Cairo,sans-serif;box-shadow:0 10px 30px rgba(31,111,92,.35);cursor:pointer;transition:transform .08s}
.circle:active{transform:scale(.96)}
.goals{display:flex;gap:8px;justify-content:center;margin:10px 0}
.goals button,.reset{border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px Cairo,sans-serif;padding:8px 16px;border-radius:20px;cursor:pointer}
.goals button.on{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:700 14px Cairo,sans-serif;padding:14px 0;cursor:pointer}
nav button.on{color:var(--acc)}
.hide{display:none}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:6px}
.splash{position:fixed;inset:0;z-index:99;background:#fff;color:#1f6f5c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.splash h2{font:700 46px Amiri,serif;margin:0 0 18px}
.splash .orn{font-size:34px;margin-bottom:14px}
.splash .by{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));color:#5b6b66;font-size:14px;line-height:1.9}
.splash .by b{display:block;color:#1f2d2a;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px Cairo,sans-serif;padding:7px 14px;border-radius:20px;cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.share{display:block;margin:20px auto 0;border:0;background:var(--acc);color:#fff;font:700 15px Cairo,sans-serif;padding:12px 28px;border-radius:26px;cursor:pointer}
.rst{display:block;margin:0 auto 14px;border:1px solid var(--line);background:var(--card);color:var(--acc);font:700 14px Cairo,sans-serif;padding:9px 22px;border-radius:22px;cursor:pointer}
.shr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}.shr .share{margin:0;padding:11px 18px;font-size:14px}.share.wa{background:#128c7e}.share.ms{background:#0b78e3}
.ins{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;text-align:center}.ins.on{display:block}.ins p{margin:0 0 12px;line-height:1.9;font-size:14px}
.credit{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 0;line-height:1.8}
</style>
</head>
<body>
<div class="ins" id="ins"><p id="it"></p><div class="shr" style="margin:0"><button class="share" id="ig">📲 ثبّت الآن</button><button class="share" style="background:var(--acc2);color:var(--acc)" id="ix">لاحقًا</button></div></div>
<div class="splash" id="sp"><div class="orn">📿</div><h2>صدقة جارية</h2><div class="by">تصميم<b>م. محمد عمر غنيمي</b><span dir="ltr">Mohamed Omar Ghonamy</span></div></div>
<h1>أذكاري</h1>

<section id="adhkar">
  <div class="seg"><button id="bm">☀️ أذكار الصباح</button><button id="be">🌙 أذكار المساء</button></div>
  <button class="rst" id="rst">🔄 ابدأ من جديد</button>
  <div id="list"></div>
</section>

<section id="tasbeeh" class="tas hide">
  <div class="note">اضغط على الدائرة للتسبيح</div>
  <button class="circle" id="tap">0</button>
  <div class="goals" id="goals"></div>
  <button class="reset" id="rs">تصفير</button>
</section>

<section id="duas" class="hide"><div class="chips" id="chips"></div><div id="dl"></div></section>

<div class="credit">تصميم: م. محمد عمر غنيمي<br><span dir="ltr">Mohamed Omar Ghonamy</span></div>
<nav><button id="n1" class="on">📿 الأذكار</button><button id="n2">🔢 السبحة</button><button id="n3">🤲 الأدعية</button></nav>

<script>
var S=[
["آيَةُ الْكُرْسِيِّ: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",1],
["قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾",3],
["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",3],
["قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾",3]
];
var M=[["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",1],
["اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ",1]];
var E=[["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",1],
["اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ",1]];
var C=[
["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",1],
["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3],
["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا",3],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",100],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",10]];

var mode=new Date().getHours()<15?"m":"e", day=new Date().toDateString(), st={};
function load(){try{var r=JSON.parse(localStorage.getItem("adhkar")||"{}");if(r.day===day)st=r}catch(e){}if(!st.day)st={day:day,c:{},t:0,g:33}}
function save(){try{localStorage.setItem("adhkar",JSON.stringify(st))}catch(e){}}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function items(){return S.concat(mode=="m"?M:E,C)}
function render(){
  document.getElementById("bm").className=mode=="m"?"on":"";
  document.getElementById("be").className=mode=="e"?"on":"";
  var l=document.getElementById("list");l.innerHTML="";
  items().forEach(function(it,i){
    var k=mode+i,n=st.c[k]||0,d=n>=it[1];
    var c=document.createElement("div");c.className="card"+(d?" done":"");
    c.innerHTML='<p class="t">'+it[0]+'</p><div class="row"><span>اضغط للعدّ</span><span class="pill">'+(d?"✓ تم":n+" / "+it[1])+'</span></div><div class="bar"><i style="width:'+Math.min(100,n/it[1]*100)+'%"></i></div>';
    c.onclick=function(){if((st.c[k]||0)<it[1]){st.c[k]=(st.c[k]||0)+1;vib(15);save();render()}};
    l.appendChild(c);
  });
}
document.getElementById("bm").onclick=function(){mode="m";render()};
document.getElementById("be").onclick=function(){mode="e";render()};

var tap=document.getElementById("tap");
function tr(){tap.textContent=st.t;var g=document.getElementById("goals");g.innerHTML="";
  [33,100,0].forEach(function(v){var b=document.createElement("button");b.textContent=v?v:"بلا حد";b.className=st.g===v?"on":"";b.onclick=function(){st.g=v;save();tr()};g.appendChild(b)})}
tap.onclick=function(){st.t++;if(st.g&&st.t>=st.g){vib([60,40,60]);}else vib(10);tap.textContent=st.t;if(st.g&&st.t>st.g){st.t=1;tap.textContent=1}save()};
document.getElementById("rs").onclick=function(){st.t=0;save();tr()};

function show(a){document.getElementById("adhkar").className=a?"":"hide";document.getElementById("tasbeeh").className=a?"tas hide":"tas";
  document.getElementById("n1").className=a?"on":"";document.getElementById("n2").className=a?"":"on"}
document.getElementById("n1").onclick=function(){show(true)};
var P=["adhkar","tasbeeh","duas"];
function go(i){P.forEach(function(p,j){document.getElementById(p).className=(j==i?"":"hide")+(p=="tasbeeh"&&j==i?"tas":"");document.getElementById("n"+(j+1)).className=j==i?"on":""})}
["n1","n2","n3"].forEach(function(id,i){document.getElementById(id).onclick=function(){go(i)}});
var D=[
["قرآنية","رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ"],
["قرآنية","رَبِّ اشْرَحْ لِي صَدْرِي ﴿٢٥﴾ وَيَسِّرْ لِي أَمْرِي ﴿٢٦﴾"],
["قرآنية","رَبِّ زِدْنِي عِلْمًا"],
["قرآنية","رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ"],
["قرآنية","رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ"],
["قرآنية","رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ"],
["قرآنية","رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا"],
["قرآنية","رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي"],
["قرآنية","رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ"],
["نبوية","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى"],
["نبوية","اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي"],
["نبوية","يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ"],
["نبوية","اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ"],
["نبوية","اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ"],
["نبوية","اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ"],
["كرب وشفاء","لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ"],
